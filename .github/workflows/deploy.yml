 name: Deploy HTML POC

  on:
    push:
      branches: [main]
    workflow_dispatch:

  permissions:
    contents: read

  concurrency:
    group: mahavistaar-poc-deploy
    cancel-in-progress: false

  jobs:
    deploy:
      runs-on: [self-hosted, linux, x64, mahavistaar-poc]
      timeout-minutes: 5

      steps:
        - name: Request Dokploy deployment
          env:
            DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
            DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
            DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          shell: bash
          run: |
            set -euo pipefail

            : "${DOKPLOY_URL:?Set DOKPLOY_URL}"
            : "${DOKPLOY_COMPOSE_ID:?Set DOKPLOY_COMPOSE_ID}"
            : "${DOKPLOY_API_KEY:?Set DOKPLOY_API_KEY}"

            python3 -c 'import json, os; print(json.dumps({
                "composeId": os.environ["DOKPLOY_COMPOSE_ID"],
                "title": "GitHub Actions deployment"
            }))' > "$RUNNER_TEMP/dokploy-request.json"

            curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 60 \
              --request POST \
              "${DOKPLOY_URL%/}/api/compose.deploy" \
              --header "x-api-key: $DOKPLOY_API_KEY" \
              --header "Content-Type: application/json" \
              --data-binary "@$RUNNER_TEMP/dokploy-request.json" \
              --output /dev/null

            echo "Dokploy accepted the deployment request."
