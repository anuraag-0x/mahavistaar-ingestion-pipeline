name: PR checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build application
        run: docker build --tag mahavistaar-poc:pr .

      - name: Verify Nginx configuration
        run: docker run --rm mahavistaar-poc:pr nginx -t

      - name: Verify the page is served correctly
        shell: bash
        run: |
          set -euo pipefail

          test -s index.html

          docker run -d \
            --name poc-check \
            -p 127.0.0.1:9081:80 \
            mahavistaar-poc:pr

          curl --fail --silent --show-error \
            --retry 10 \
            --retry-connrefused \
            --retry-delay 1 \
            --connect-timeout 2 \
            --max-time 5 \
            http://127.0.0.1:9081/ \
            --output "$RUNNER_TEMP/served.html"

          cmp index.html "$RUNNER_TEMP/served.html"

      - name: Show container logs on failure
        if: failure()
        run: docker logs poc-check || true

      - name: Remove test container
        if: always()
        run: docker rm -f poc-check 2>/dev/null || true
