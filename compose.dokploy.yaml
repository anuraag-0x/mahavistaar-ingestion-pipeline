# Release template; scripts/render_release.py embeds configs for Dokploy Raw mode.
x-backend: &backend
  image: ${BACKEND_IMAGE:?Set the backend release image}
  pull_policy: always
  env_file: .env
  environment:
    ENVIRONMENT: production
    DEBUG: "false"
    AUTH_DISABLED: "false"
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_DB: ${POSTGRES_DB:?Set the application database}
    POSTGRES_USER: ${POSTGRES_USER:?Set the application database user}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the application database password}
    DATABASE_URL: ""
    ASYNC_DATABASE_URL: ""
    MINIO_ENDPOINT: minio:9000
    MINIO_SECURE: "false"
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Set MinIO credentials}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MinIO credentials}
    QDRANT_URL: http://qdrant:6333
    QDRANT_API_KEY: ""
    KEYCLOAK_BASE_URL: http://keycloak:8080/auth
    KEYCLOAK_ISSUER: ${APP_ORIGIN:?Set the browser-facing origin}/auth/realms/docs-pipeline
    KEYCLOAK_JWKS_URL: http://keycloak:8080/auth/realms/docs-pipeline/protocol/openid-connect/certs
    KEYCLOAK_TOKEN_URL: http://keycloak:8080/auth/realms/docs-pipeline/protocol/openid-connect/token
    KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080/auth
    KEYCLOAK_REALM: docs-pipeline
    KEYCLOAK_ADMIN_REALM: docs-pipeline
    KEYCLOAK_ADMIN_TOKEN_REALM: master
    KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
    KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set the Keycloak admin password}
    KEYCLOAK_OTP_CLIENT_ID: docs-pipeline-ui
    KEYCLOAK_CLIENT_SECRET: ""
    CORS_ORIGINS: ${APP_ORIGIN}
    HF_EMBEDDING_SERVICE_URL: ${HF_EMBEDDING_SERVICE_URL:?Set the embedding service URL}
    MISTRAL_API_KEY: ${MISTRAL_API_KEY:?Set the OCR API key}
  restart: unless-stopped

services:
  # Fails startup if the existing database cannot be reached or initialized.
  db-init:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "backend.deploy_init"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8002", "--root-path", "/api"]
    depends_on:
      db-init:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    command: ["python", "-m", "backend.worker"]
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:?Set the frontend release image}
    pull_policy: always
    environment:
      API_PROXY_TARGET: http://api:8002
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  nginx:
    image: nginx:1.28-alpine
    networks:
      - default
      - dokploy-network
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_CONSOLE_URL:?Set the public MinIO console URL on port 9001}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.14.1
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.1.4
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: 5432
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB:-docs-pipeline-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-postgres}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-postgres}
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${APP_ORIGIN}/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      APP_ORIGIN: ${APP_ORIGIN}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:?Set the initial application admin email}
      APP_ADMIN_USERNAME: ${APP_ADMIN_USERNAME:?Set the initial application admin username}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:?Set the initial application admin password}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - 'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /auth/health/ready HTTP/1.0\r\n\r\n" >&3; IFS= read -r status <&3; [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/docs-pipeline-realm.json
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docs-pipeline}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      KEYCLOAK_DB: ${KEYCLOAK_DB:-docs-pipeline-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-postgres}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    configs:
      - source: postgres-init
        target: /docker-entrypoint-initdb.d/20-keycloak.sh
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
  minio-data:
  qdrant-data:

networks:
  dokploy-network:
    external: true

configs:
  nginx-config:
    file: ./deploy/nginx-dokploy.conf
  keycloak-realm:
    file: ./deploy/keycloak-realm.json
  postgres-init:
    file: ./deploy/postgres-init.sh
