# Only Traefik can reach this gateway; no host ports are published.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
    http http;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 110m;

    # Docker DNS: resolve replacement containers without restarting Nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8002;
    set $frontend http://frontend:3000;
    set $keycloak http://keycloak:8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /health {
        add_header X-Release-Sha "__RELEASE_SHA__" always;
        proxy_pass $api/health;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api;
        proxy_buffering off;
        proxy_cache off;
    }

    # This is a Next.js route, despite sharing Keycloak's /auth prefix.
    location = /auth/sso-callback {
        proxy_pass $frontend;
    }

    location /auth/ {
        proxy_pass $keycloak;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $frontend;
    }
}
