# Host Nginx vhost for the application server. Install on the app host as
# /etc/nginx/sites-available/vistaar-docs.mahapocra.gov.in.conf and symlink it
# into sites-enabled.
#
# Compose publishes the containers on loopback only, so this vhost is the sole
# entry point. Ports must match API_HOST_PORT, UI_HOST_PORT and
# KEYCLOAK_HOST_PORT in .env.
#
# The certificate is the *.mahapocra.gov.in wildcard copied from the edge
# server. It is renewed there and this copy does not follow: re-copy both files
# and run `systemctl reload nginx` whenever it is replaced.

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name vistaar-docs.mahapocra.gov.in;
    return 301 https://$host$request_uri;
}

server {
    # `listen ... http2` rather than `http2 on;`: Ubuntu 22.04 ships Nginx 1.18,
    # which predates the newer directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vistaar-docs.mahapocra.gov.in;

    ssl_certificate     /etc/ssl/star_mahapocra_gov_in.crt;
    ssl_certificate_key /etc/ssl/star_mahapocra_gov_in.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # PDF uploads. The default 1m would reject them with 413.
    client_max_body_size 110m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;

    # The workspace event stream is long-lived.
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    location = /health {
        proxy_pass http://127.0.0.1:8002/health;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8002;
        proxy_buffering off;
        proxy_cache off;
    }

    # This is a Next.js route, despite sharing Keycloak's /auth prefix.
    location = /auth/sso-callback {
        proxy_pass http://127.0.0.1:3000;
    }

    location /auth/ {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass http://127.0.0.1:3000;
    }
}
