<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Mahavistaar · Deployment POC</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; background: #081811; color: #edf7f0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: 100%; max-width: 680px; padding: clamp(24px, 6vw, 56px);
      border: 1px solid #294b38; border-radius: 24px; background: #10261b;
    }
    .label { color: #83dfa5; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 24px 0 16px; font-size: clamp(32px, 7vw, 52px); line-height: 1.1; }
    p { color: #bdd0c3; line-height: 1.7; }
    .version { display: inline-block; margin-top: 20px; padding: 8px 14px; border-radius: 99px; background: #234831; }
    footer { margin-top: 36px; padding-top: 20px; border-top: 1px solid #294b38; font-size: 14px; color: #bdd0c3; }
  </style>
</head>
<body>
  <main>
    <div class="label">Mahavistaar / Deployment POC</div>
    <h1>Hello from Mahavistaar.</h1>
    <p>This is our first static page for testing deployment through Dokploy.
      It uses one HTML file, with no database, API, or external dependencies.</p>
    <span class="version">Version 1.1</span>
    <footer>To test an update, change the version to 1.1, commit, and redeploy.</footer>
  </main>
</body>
</html>
